<!doctype html>
<!--
  =====================================================================
  DE DON · INDIVIDUAL ROOM PAGE  (address: /rooms/<room-url-name>)
  This page is a template used for EVERY room. Room name, photos, description,
  amenities, policies and price come from Admin → Rooms. Text written here
  (e.g. "In the room", "Gallery") is shared by all room pages.
  =====================================================================
-->
<html lang="en-NG">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Opens this page on the website server when viewed inside VS Code (see the file for details) -->
  <script src="assets/js/vscode-preview.js"></script>
  <title>Room · DE DON · Luxury Hotel in Abuja</title>
  <meta name="description" content="Room details, amenities and reservations at DE DON, Abuja.">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Room · DE DON, Abuja">
  <meta property="og:description" content="Room details, amenities and reservations at DE DON, Abuja.">
  <meta property="og:image" content="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b?auto=format&fit=crop&w=1200&q=75">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#101B1B">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/pages.js" defer></script>
  <script src="/assets/js/booking.js" defer></script>
</head>
<body data-page="room">
  <main id="main">
    <section class="page-hero">
      <div class="page-hero__media" id="room-hero-img"><div class="skeleton" style="width:100%;height:100%"></div></div>
      <div class="container page-hero__content">
        <p class="eyebrow"><a href="/accommodation">Accommodation</a></p>
        <div class="page-hero__meta"><h1 id="room-name">&nbsp;</h1><p id="room-tagline"></p></div>
      </div>
    </section>
    <section class="section">
      <div class="container room-detail">
        <div class="room-detail__main">
          <div class="lead" id="room-desc" data-reveal></div>
          <dl class="facts" id="room-facts" data-reveal></dl>
          <h3 class="mt-l" data-reveal>In the room</h3>
          <ul class="amenity-list mt-s" id="room-amenities" data-reveal></ul>
          <h3 class="mt-l" data-reveal>Gallery</h3>
          <div class="room-gallery mt-s" id="room-gallery"></div>
          <h3 class="mt-l" data-reveal>Room policies</h3>
          <ul class="amenity-list mt-s" id="room-policies" style="columns:1" data-reveal></ul>
        </div>
        <aside class="room-detail__aside">
          <div class="booking-panel" data-reveal>
            <p class="label">Reserve this room</p>
            <p class="price-big mt-s" id="room-price">&nbsp;</p>
            <p class="muted" style="font-size:.8rem" id="room-price-note"></p>
            <form id="room-book" class="mt-s" novalidate>
              <div class="form-grid" style="gap:22px">
                <div class="field"><label for="rb-in">Arrival</label><input id="rb-in" type="date" name="checkIn" required></div>
                <div class="field"><label for="rb-out">Departure</label><input id="rb-out" type="date" name="checkOut" required></div>
                <div class="field"><label for="rb-ad">Adults</label><select id="rb-ad" name="adults"></select></div>
                <div class="field"><label for="rb-ch">Children</label><select id="rb-ch" name="children"></select></div>
              </div>
              <div class="booking-panel__summary" id="rb-summary" aria-live="polite"></div>
              <button class="btn btn--block mt-s" type="submit">Continue to reserve</button>
            </form>
            <p class="muted mt-s" style="font-size:.78rem;margin-bottom:0">Your request is confirmed by our reservations team. No payment is taken online.</p>
          </div>
        </aside>
      </div>
    </section>
    <section class="section section--paper" id="other-rooms-section">
      <div class="container section-head"><div><p class="eyebrow">Continue exploring</p><h2 data-split>Other rooms<br>&amp; suites</h2></div></div>
      <div class="rail-wrap">
        <div class="rail" id="other-rooms" tabindex="0" aria-label="Other rooms"></div>
        <div class="container rail__controls">
          <button class="rail__btn" data-rail-prev aria-label="Previous"><svg viewBox="0 0 22 8"><path d="M22 4H1M4.5.5 1 4l3.5 3.5" fill="none" stroke="currentColor"/></svg></button>
          <div class="rail__progress"><span></span></div>
          <button class="rail__btn" data-rail-next aria-label="Next"><svg viewBox="0 0 22 8"><path d="M0 4h21M17.5.5 21 4l-3.5 3.5" fill="none" stroke="currentColor"/></svg></button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
